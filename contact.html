<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactez-nous | [VOTRE AGENCE]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-['Plus_Jakarta_Sans'] antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-slate-900 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl font-extrabold text-white tracking-tight flex items-center gap-2">
                <i class="ph-fill ph-shield-check text-blue-500 text-2xl"></i>
                [VOTRE AGENCE]
            </a>
            <a href="devis.html" class="text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 transition px-6 py-2.5 rounded-full">
                Demander un devis
            </a>
        </div>
    </nav>

    <!-- Formulaire de Contact -->
    <main class="flex-grow flex items-center justify-center py-16 px-6">
        <div class="max-w-xl w-full bg-white p-10 rounded-2xl shadow-xl border border-slate-200">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Contactez-nous</h1>
                <p class="text-slate-500 text-sm mt-2">Une question ? Notre équipe vous répond sous 24h.</p>
            </div>
            
            <form action="#" method="POST" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Nom complet</label>
                    <input type="text" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Email professionnel</label>
                    <input type="email" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Sujet</label>
                    <select required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                        <option value="">Sélectionnez un sujet...</option>
                        <option value="info">Demande d'information générale</option>
                        <option value="handicap">Question sur l'accessibilité (PSH)</option>
                        <option value="autre">Autre demande</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Message</label>
                    <textarea rows="4" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition"></textarea>
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-blue-600 text-white font-bold py-3.5 px-6 rounded-lg transition">
                    Envoyer le message
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 py-8 text-center text-slate-500 text-xs mt-auto">
        <p>&copy; 2026 [VOTRE AGENCE] - Organisme certifié Qualiopi.</p>
    </footer>

</body>
</html>
