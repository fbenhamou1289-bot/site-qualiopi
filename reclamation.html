<script>
        const form = document.getElementById('reclamation-form');
        const successMsg = document.getElementById('success-msg');
        
        // URL du nouveau Webhook
        const RECLAMATION_WEBHOOK_URL = "https://fatben.app.n8n.cloud/webhook-test/reception-reclamation";

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            try {
                // Envoi des données vers n8n
                await fetch(RECLAMATION_WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
            } catch (err) {
                console.error("Erreur Webhook", err);
            }

            // Animation visuelle de succès
            form.classList.add('hidden');
            successMsg.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
